spring:
  application:
    name: hr-management

  datasource:
    url: jdbc:mysql://localhost:3306/hr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

logging:
  level:
    root: INFO
    com.wegrow: DEBUG
    org.hibernate.SQL: DEBUG
    org.liquibase: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html