spring:
  application:
    name: hr-management

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/hr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:hr_user}
    password: ${DB_PASSWORD:hr_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

logging:
  level:
    root: INFO
    com.wegrow: DEBUG
    org.hibernate.SQL: DEBUG
    org.liquibase: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html